<body>

  <header class="top">
    <a class="brand" href="index.html" aria-label="Accueil"><img src="assets/logo_rolland.ico" alt="" width="28"
        height="28">RCYBER<b>.FREELANCER</b></a>
    <button class="burger" aria-label="Menu" aria-expanded="false">☰</button>
    <nav aria-label="Navigation principale">
      <a href="services.html" data-fr="Services" data-en="Services">Services</a>
      <a href="projects.html" data-fr="Projets" data-en="Projects">Projets</a>
      <a href="experience.html" data-fr="Parcours" data-en="Experience">Parcours</a>
      <a href="skills.html" data-fr="Compétences" data-en="Skills">Compétences</a>
      <a class="cta active" href="contact.html" data-fr="Me contacter" data-en="Contact me">Me contacter</a>
      <button class="lang" type="button" aria-label="Switch language">EN</button>
    </nav>
  </header>

  <main>
    <section class="wrap sec contact" id="contact">
      <h2 data-fr="Un projet à confier ?" data-en="Got a project?">Un projet à confier ?</h2>
      <p data-fr="Décrivez votre besoin, je réponds avec une approche et un calendrier clairs."
        data-en="Describe your need and I'll reply with a clear approach and timeline.">Décrivez votre besoin, je
        réponds avec une approche et un calendrier clairs.</p>
      <form id="contact-form" class="form" novalidate>
        <input type="hidden" name="access_key" value="VOTRE_CLE_WEB3FORMS">
        <input type="hidden" name="subject" value="Nouveau message depuis le portfolio">
        <input type="hidden" name="from_name" value="Portfolio rollandmami.github.io">
        <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" style="display:none">
        <label><span data-fr="Nom" data-en="Name">Nom</span><input name="name" required autocomplete="name"></label>
        <label><span>Email</span><input type="email" name="email" required autocomplete="email"></label>
        <label><span data-fr="Votre projet" data-en="Your project">Votre projet</span><textarea name="message" rows="5"
            required></textarea></label>
        <button class="btn primary" type="submit"><span data-fr="Envoyer le message" data-en="Send message">Envoyer le
            message</span></button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
      <p class="alt"><span data-fr="Ou directement :" data-en="Or directly:">Ou directement :</span> <a
          href="mailto:rcyberfreelancermg@gmail.com?subject=Projet%20freelance">rcyberfreelancermg@gmail.com</a> · <a
          href="https://github.com/RollandMami" target="_blank" rel="noopener">GitHub</a></p>
    </section>
  </main>
  <footer class="wrap foot"><span>© <span id="year"></span> RCyber Freelancer · Antananarivo, Madagascar</span><a
      href="#" aria-label="Haut de page">↑</a></footer>
